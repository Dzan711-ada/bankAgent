[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-policy-agent"
version = "0.1.0"
description = "LangChain and LangGraph banking policy RAG agent"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langchain>=1.0,<2", "langchain-openai>=1.0,<2", "langgraph>=1.0,<2",
  "chromadb>=1.0,<2", "pydantic-settings>=2.6,<3", "python-dotenv>=1.0,<2",
  "python-docx>=1.1,<2", "pdfplumber>=0.11,<1", "rank-bm25>=0.2.2,<1",
  "jieba>=0.42.1,<1", "fastapi>=0.115,<1", "uvicorn>=0.32,<1",
  "python-multipart>=0.0.18,<1", "streamlit>=1.40,<2", "httpx>=0.27,<1",
  "tiktoken>=0.8,<1", "tzdata>=2024.2",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.3,<6"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
bank-agent = "bank_agent.cli:main"

[tool.setuptools.packages.find]
include = ["bank_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

